# Redirect waitlist API to Netlify Function (stores signups in Netlify Blobs)
[[redirects]]
  from = "/api/join-waitlist"
  to = "/.netlify/functions/join-waitlist"
  status = 200
  force = true

# Protected admin: fetch waitlist (with optional date/duration filters)
[[redirects]]
  from = "/api/admin/waitlist"
  to = "/.netlify/functions/get-waitlist"
  status = 200
  force = true

# Protected admin: update waitlist status (PATCH)
[[redirects]]
  from = "/api/admin/waitlist-update"
  to = "/.netlify/functions/update-waitlist-status"
  status = 200
  force = true

# Durable founding-member signups (Netlify Blobs) — .data/*.json is ephemeral on Netlify
[[redirects]]
  from = "/api/founding-member"
  to = "/.netlify/functions/founding-member"
  status = 200
  force = true

# Durable onboarding intake submissions (Netlify Blobs)
[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
  force = true

# Protected admin: fetch founding-member signups
[[redirects]]
  from = "/api/admin/founding-members"
  to = "/.netlify/functions/get-founding-members"
  status = 200
  force = true

# Protected admin: fetch intake submissions
[[redirects]]
  from = "/api/admin/intake"
  to = "/.netlify/functions/get-intake"
  status = 200
  force = true

# Admin: manually set/clear the founding-spots override (GET/POST/DELETE)
[[redirects]]
  from = "/api/admin/spots"
  to = "/.netlify/functions/set-spots"
  status = 200
  force = true

# Lead magnet: reactivation-calculator email capture
[[redirects]]
  from = "/api/lead-magnet"
  to = "/.netlify/functions/lead-magnet"
  status = 200
  force = true

# Protected admin: fetch lead-magnet captures
[[redirects]]
  from = "/api/admin/lead-magnet"
  to = "/.netlify/functions/get-lead-magnet"
  status = 200
  force = true

# Public: get spots taken count (manual override wins, else backend auto-count)
[[redirects]]
  from = "/api/spots-taken"
  to = "/.netlify/functions/spots-taken"
  status = 200
  force = true
